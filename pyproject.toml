[project]
name = "credit-scoring-service"
version = "0.4.0"
description = "MLOps Credit Scoring Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "faststream[cli,rabbit]>=0.7.8",
    "mlflow-skinny>=3.18.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.1",
    "httpx>=0.28.1",
    "xgboost-cpu>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
    "pytest-timeout>=2.4.0",
]
train = [
    "matplotlib>=3.11.2",
    "xlrd>=2.0.2",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "RET"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"training/*.py" = ["E402", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["credit_scoring", "training", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = ["integration: нужен Docker (Testcontainers)"]

[tool.coverage.run]
source = ["credit_scoring"]
branch = true

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
